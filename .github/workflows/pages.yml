name: Deploy static HTML to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      test_access:
        description: "Test page access for this deployment"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - open
          - closed
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Pages artifact
        shell: bash
        env:
          TEST_ACCESS: ${{ github.event.inputs.test_access || 'auto' }}
          TEST_OPEN_WINDOWS_HK: ${{ vars.TEST_OPEN_WINDOWS_HK }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          shopt -s dotglob
          for item in *; do
            case "$item" in
              .git|.github|test|_site)
                ;;
              *)
                cp -R "$item" _site/
                ;;
            esac
          done

          is_time_open=false
          now="$(TZ=Asia/Hong_Kong date +%H:%M)"
          IFS=',' read -ra windows <<< "${TEST_OPEN_WINDOWS_HK:-}"
          for window in "${windows[@]}"; do
            window="$(echo "$window" | xargs)"
            [[ -z "$window" ]] && continue
            start="${window%-*}"
            end="${window#*-}"
            if [[ "$start" == "$end" ]]; then
              continue
            elif [[ "$start" < "$end" ]]; then
              if [[ "$now" > "$start" && "$now" < "$end" || "$now" == "$start" ]]; then
                is_time_open=true
              fi
            else
              if [[ "$now" > "$start" || "$now" < "$end" || "$now" == "$start" ]]; then
                is_time_open=true
              fi
            fi
          done

          include_test=false
          case "$TEST_ACCESS" in
            open) include_test=true ;;
            closed) include_test=false ;;
            auto) include_test="$is_time_open" ;;
          esac

          mkdir -p _site/test
          build_time="$(TZ=Asia/Hong_Kong date +%Y-%m-%dT%H:%M:%S%z)"
          export TEST_BUILD_TIME="$build_time"
          python3 - <<'PY'
          import os
          from pathlib import Path

          replacements = {
              "__TEST_ACCESS__": os.environ.get("TEST_ACCESS", "auto"),
              "__TEST_OPEN_WINDOWS_HK__": os.environ.get("TEST_OPEN_WINDOWS_HK", ""),
              "__TEST_BUILD_TIME__": os.environ.get("TEST_BUILD_TIME", ""),
          }

          for relative in ("test/index.html", "test/access.js"):
              source = Path(relative)
              if not source.exists():
                  raise SystemExit(f"Missing required test gate file: {source}")
              text = source.read_text(encoding="utf-8")
              for needle, value in replacements.items():
                  text = text.replace(needle, value)
              target = Path("_site") / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8", newline="\n")
          PY

          if [[ "$include_test" == "true" && -f test/play.html ]]; then
            cp test/play.html _site/test/play.html
            echo "Test play page included. now=$now windows=${TEST_OPEN_WINDOWS_HK:-unset} mode=$TEST_ACCESS build=$build_time"
          else
            echo "Test gate only. now=$now windows=${TEST_OPEN_WINDOWS_HK:-unset} mode=$TEST_ACCESS build=$build_time"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
