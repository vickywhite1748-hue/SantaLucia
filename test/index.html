<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桑塔露琪亚测试入口</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f1e8;
      --ink: #221f1a;
      --muted: #766e62;
      --line: rgba(34, 31, 26, .16);
      --panel: rgba(255, 252, 245, .72);
      --accent: #7b5e3e;
      --shadow: rgba(65, 52, 33, .15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10100f;
        --ink: #f1ede5;
        --muted: #aaa197;
        --line: rgba(241, 237, 229, .16);
        --panel: rgba(22, 21, 19, .72);
        --accent: #d8cab2;
        --shadow: rgba(0, 0, 0, .3);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,0,0,.025) 1px, transparent 1px),
        var(--bg);
      background-size: 56px 56px, 56px 56px, auto;
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 22px 70px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .kicker {
      margin: 0 0 14px;
      color: var(--muted);
      font: 12px/1.2 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: 0;
    }

    p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    dl {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px 18px;
      margin: 28px 0 0;
      padding: 18px 0 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    dt {
      color: var(--ink);
      font-weight: 600;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    a,
    button {
      min-height: 42px;
      border: 1px solid var(--line);
      padding: 0 18px;
      background: transparent;
      color: var(--ink);
      font: 14px/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    a.primary,
    button.primary {
      border-color: color-mix(in srgb, var(--accent) 62%, var(--line));
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body data-test-page="entry">
  <main>
    <p class="kicker">SantaLucia Test</p>
    <h1 id="testTitle">正在检查测试入口</h1>
    <p id="testMessage">请稍候。</p>
    <dl>
      <dt>香港时间</dt>
      <dd id="testNow">-</dd>
      <dt>开放时段</dt>
      <dd id="testWindows">-</dd>
      <dt>部署模式</dt>
      <dd id="testMode">-</dd>
    </dl>
    <div class="actions">
      <a class="primary" id="testEnterLink" href="play.html" hidden>进入测试版</a>
      <button id="testRefreshButton" type="button">刷新状态</button>
      <a href="../">返回正式版</a>
    </div>
  </main>
  <script src="access.js" data-test-page="entry"></script>
</body>
</html>
