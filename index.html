      el.recordList.classList.add("wide");
      const wrapper = document.createElement("div");
      wrapper.className = "setting-grid";
      wrapper.innerHTML = `
        <div class="setting-card">
          <label for="settingColorMode">明暗模式</label>
          <select class="select-field" id="settingColorMode" data-setting="colorMode">
            <option value="light">浅色模式</option>
            <option value="dark">深色模式</option>
          </select>
        </div>
        <div class="setting-card">
          <label for="settingFont">字号</label>
          <select class="select-field" id="settingFont" data-setting="fontScale">
            <option value="0.92">小</option>
            <option value="1">中</option>
            <option value="1.12">大</option>
            <option value="1.24">特大</option>
          </select>
        </div>
        <div class="setting-card">
          <label for="settingMotion">动效强度</label>
          <select class="select-field" id="settingMotion" data-setting="motion">
            <option value="full">完整</option>
            <option value="soft">柔和</option>
            <option value="off">关闭</option>
          </select>
        </div>
        <div class="setting-card">
          <label for="settingAutoplay">自动播放</label>
          <select class="select-field" id="settingAutoplay" data-setting="autoplay">
            <option value="0">关闭</option>
            <option value="4200">慢</option>
            <option value="3000">中</option>
            <option value="1900">快</option>
          </select>
        </div>
        <div class="setting-card" data-debug-setting>
          <label for="settingDebugMode">调试模式</label>
          <select class="select-field" id="settingDebugMode" data-setting="debugMode">
            <option value="false">关闭</option>
            <option value="true">开启</option>
          </select>
        </div>
      `;
      el.recordList.appendChild(wrapper);
      wrapper.querySelector('[data-setting="colorMode"]').value = state.settings.colorMode === "dark" ? "dark" : "light";
      wrapper.querySelector('[data-setting="fontScale"]').value = String(state.settings.fontScale);
      wrapper.querySelector('[data-setting="motion"]').value = state.settings.motion;
      wrapper.querySelector('[data-setting="autoplay"]').value = String(state.settings.autoplay);
      wrapper.querySelector('[data-setting="debugMode"]').value = state.settings.debugMode === true || state.settings.debugMode === "true" ? "true" : "false";
    }

    function renderSaveSlots() {
      el.recordTitle.textContent = "存档槽";
      el.recordList.classList.add("wide");
      const auto = getValidAutoSave();
      appendSaveSlot("自动存档", auto?.snapshot, "auto");
      for (let i = 1; i <= 3; i += 1) {
        appendSaveSlot(`手动存档 ${i}`, readSlot(i), String(i));
      }
    }

    function renderChapterSelect() {
      el.recordTitle.textContent = "选择章节";
      el.recordList.classList.add("wide");
      const checkpoints = readCheckpoints().filter(item => item.kind === "chapter");
      const byNode = new Map(checkpoints.map(item => [item.nodeId, item]));
      const chapters = Object.entries(state.story.nodes || {})
        .filter(([, node]) => node.chapterTitle)
        .map(([nodeId, node]) => ({
          nodeId,
          title: node.chapterTitle,
          checkpoint: byNode.get(nodeId)
        }));

      if (!chapters.length) {
        appendRecordItem("没有章节节点", "剧本中没有带 chapterTitle 的节点。", false);
        return;
      }

      chapters.forEach(chapter => {
        const item = document.createElement("div");
        item.className = `record-item${chapter.checkpoint ? "" : " locked"}`;
        if (!chapter.checkpoint) {
          const mark = document.createElement("div");
          mark.className = "unknown-mark";
          mark.textContent = "LOCK";
          item.appendChild(mark);
        }
        const title = document.createElement("strong");
        title.textContent = chapter.checkpoint ? chapter.title : "？？？";
        const body = document.createElement("span");
        body.textContent = chapter.checkpoint ? describeSnapshot(chapter.checkpoint.snapshot) : "尚未游玩到此章节";
        const actions = document.createElement("div");
        actions.className = "record-actions";
        if (chapter.checkpoint) actions.append(makeMiniButton("从这里开始", "load-checkpoint", chapter.checkpoint.id));
        item.append(title, body);
        if (chapter.checkpoint) appendSnapshotTags(item, chapter.checkpoint.snapshot);
        item.append(actions);
        el.recordList.appendChild(item);
      });
    }

    function renderMenuChapterSelect() {
      el.menuChapterList.innerHTML = "";
      const checkpoints = readCheckpoints().filter(item => item.kind === "chapter");
      const byNode = new Map(checkpoints.map(item => [item.nodeId, item]));
      const chapters = Object.entries(state.story?.nodes || {})
        .filter(([, node]) => node.chapterTitle)
        .map(([nodeId, node]) => ({
          nodeId,
          title: node.chapterTitle,
          checkpoint: byNode.get(nodeId)
        }));

      if (!chapters.length) {
        const item = document.createElement("div");
        item.className = "record-item";
        item.textContent = "没有可选择的章节。";
        el.menuChapterList.appendChild(item);
      }

      chapters.forEach(chapter => {
        const item = document.createElement("div");
        item.className = `record-item${chapter.checkpoint ? "" : " locked"}`;
        const title = document.createElement("strong");
        title.textContent = chapter.checkpoint ? chapter.title : "？？？";
        const body = document.createElement("span");
        body.textContent = chapter.checkpoint ? describeSnapshot(chapter.checkpoint.snapshot) : "尚未游玩到此章节";
        const actions = document.createElement("div");
        actions.className = "record-actions";
        if (chapter.checkpoint) actions.append(makeMiniButton("从这里开始", "load-checkpoint", chapter.checkpoint.id));
        item.append(title, body);
        if (chapter.checkpoint) appendSnapshotTags(item, chapter.checkpoint.snapshot);
        item.append(actions);
        el.menuChapterList.appendChild(item);
      });

      el.menuChapterList.classList.toggle("is-hidden");
    }

    function appendSaveSlot(titleText, snapshot, slot) {
      const item = document.createElement("div");
      item.className = "record-item";
      const title = document.createElement("strong");
      title.textContent = titleText;
      const body = document.createElement("span");
      body.textContent = snapshot ? describeSnapshot(snapshot) : "空存档";
      const actions = document.createElement("div");
      actions.className = "record-actions";

      if (snapshot) {
        actions.append(makeMiniButton("读取", "load-slot", slot));
        if (slot !== "auto") actions.append(makeMiniButton("删除", "delete-slot", slot));
      }
      item.append(title, body);
      if (snapshot) appendSnapshotTags(item, snapshot);
      item.append(actions);
      el.recordList.appendChild(item);
    }

    function makeMiniButton(text, action, value) {
      const button = document.createElement("button");
      button.className = "mini-btn";
      button.type = "button";
      button.textContent = text;
      button.dataset.action = action;
      button.dataset.value = value;
      return button;
    }

    function saveGame() {
      if (!state.story || !state.currentNodeId) return;
      const save = {
        storyTitle: state.story.meta.title,
        storyVersion: getStoryVersion(),
        snapshot: getSnapshot()
      };
      safeLocalSet(`${state.storageKey}_save`, JSON.stringify(save), "自动存档");
    }

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(`${state.storageKey}_save`) || "null");
      } catch {
        return null;
      }
    }

    function isValidAutoSave(save) {
      if (!state.story || !save || save.storyTitle !== state.story.meta.title) return false;
      if (save.storyVersion !== getStoryVersion()) return false;
      return isValidSnapshot(save.snapshot);
    }

    function getValidAutoSave() {
      const save = readSave();
      if (isValidAutoSave(save)) return save;
      if (save && state.story) safeLocalRemove(`${state.storageKey}_save`, "自动存档");
      return null;
    }

    function restoreSave(save) {
      if (!save?.snapshot) return false;
      return restoreSnapshot(save.snapshot);
    }

    function readEndings() {
      try {
        return JSON.parse(localStorage.getItem(`${state.storageKey}_endings`) || "[]");
      } catch {
        return [];
      }
    }

    function readAchievements() {
      try {
        return JSON.parse(localStorage.getItem(`${state.storageKey}_achievements`) || "[]");
      } catch {
        return [];
      }
    }

    function readCheckpoints() {
      try {
        const checkpoints = JSON.parse(localStorage.getItem(`${state.storageKey}_checkpoints`) || "[]");
        return checkpoints.filter(item => item?.snapshot && isValidSnapshot(item.snapshot));
      } catch {
        return [];
      }
    }

    function saveCheckpoints(checkpoints) {
      safeLocalSet(`${state.storageKey}_checkpoints`, JSON.stringify(checkpoints.slice(-80)), "检查点");
    }

    function recordCheckpoint(nodeId, label, kind = "manual", snapshotOverride = null) {
      if (!state.story || !nodeId) return;
      const snapshot = snapshotOverride
        ? compactSnapshot(snapshotOverride)
        : getSnapshot({ includeHistory: false, includeChoiceHistory: false });
      snapshot.currentNodeId = nodeId;
      if (kind === "chapter") {
        snapshot.segmentIndex = 0;
      } else if (kind === "choice") {
        snapshot.segmentIndex = (state.story.nodes[nodeId]?.segments || []).length;
      }
      const checkpoints = kind === "chapter"
        ? readCheckpoints().filter(item => !(item.kind === kind && item.nodeId === nodeId))
        : readCheckpoints();
      checkpoints.push({
        id: `${kind}_${slug(nodeId)}_${Date.now()}`,
        kind,
        nodeId,
        label,
        storyTitle: state.story.meta.title,
        storyVersion: getStoryVersion(),
        snapshot,
        at: new Date().toISOString()
      });
      saveCheckpoints(checkpoints);
      state.checkpoints = checkpoints;
    }

    function loadCheckpointById(id) {
      const checkpoint = readCheckpoints().find(item => item.id === id);
      if (!checkpoint?.snapshot || !isValidSnapshot(checkpoint.snapshot)) {
        showToast("检查点已失效", "当前作品版本已更新，无法回到旧检查点。");
        return;
      }
      if (checkpoint.kind === "choice") state.skipNextChoiceCheckpoint = true;
      resetTransientPlayback();
      clearReaderSurface();
      if (!restoreSnapshot(checkpoint.snapshot)) return;
      el.launcher.classList.add("is-hidden");
      el.body.dataset.mode = "play";
      el.recordPanel.classList.remove("is-visible");
      processNode(state.currentNodeId, { fromHistory: true, showChapter: true, keepSegment: true });
    }

    function returnToPreviousCheckpoint() {
      const choiceSnapshot = takePreviousChoiceSnapshot();
      if (choiceSnapshot) {
        closeMenu();
        restoreChoiceSnapshot(choiceSnapshot);
        showToast("已退回上一个选择", choiceSnapshot.choiceLabel || choiceSnapshot.currentNodeId);
        return;
      }
      const checkpoints = readCheckpoints().filter(item => item.kind === "choice");
      if (!checkpoints.length) {
        showToast("没有选择检查点", "尚未记录可回退的选项。");
        return;
      }
      const current = state.currentNodeId;
      const atChoice = el.choices.classList.contains("is-visible");
      const candidates = checkpoints.filter(item => !(atChoice && item.nodeId === current));
      const checkpoint = candidates[candidates.length - 1] || null;
      if (!checkpoint) {
        showToast("没有更早的选择", "当前已经在最早的选项。");
        return;
      }
      closeMenu();
      loadCheckpointById(checkpoint.id);
      showToast("已退回上一个选择", checkpoint.label || checkpoint.nodeId);
    }

    function readSettings() {
      try {
        const settings = { colorMode: "light", fontScale: 1, motion: "full", autoplay: 0, debugMode: false, ...JSON.parse(localStorage.getItem("branch_story_settings") || "{}") };
        if (!DEBUG_BUILD_ENABLED) settings.debugMode = false;
        return settings;
      } catch {
        return { colorMode: "light", fontScale: 1, motion: "full", autoplay: 0, debugMode: false };
      }
    }

    function saveSettings() {
      safeLocalSet("branch_story_settings", JSON.stringify(state.settings), "设置");
    }

    function applySettings() {
      document.documentElement.style.setProperty("--story-font-scale", state.settings.fontScale);
      el.body.dataset.motion = state.settings.motion || "full";
      el.body.dataset.debugBuild = DEBUG_BUILD_ENABLED ? "on" : "off";
      el.body.dataset.debugEditor = DEBUG_EDITOR_ENABLED ? "on" : "off";
      if (!DEBUG_EDITOR_ENABLED) {
        state.debugEditorOpen = false;
        state.hasDebugEdits = false;
      }
      const colorMode = state.settings.colorMode === "dark" ? "dark" : "light";
      state.settings.colorMode = colorMode;
      el.body.dataset.colorMode = colorMode;
      el.body.dataset.theme = "neutral";
      syncColorModeControls();
      applyDebugMode();
    }

    function setColorMode(mode) {
      state.settings.colorMode = mode === "dark" ? "dark" : "light";
      saveSettings();
      applySettings();
    }

    function syncColorModeControls() {
      const current = state.settings.colorMode === "dark" ? "dark" : "light";
      document.querySelectorAll("[data-color-mode-choice]").forEach(button => {
        button.classList.toggle("is-active", button.dataset.colorModeChoice === current);
      });
      document.querySelectorAll('[data-setting="colorMode"]').forEach(input => {
        input.value = current;
      });
    }

    function applyDebugMode() {
      if (!DEBUG_BUILD_ENABLED) {
        state.settings.debugMode = false;
        el.body.dataset.debug = "off";
        el.debugPanel?.classList.add("is-hidden");
        if (el.debugToggleBtn) el.debugToggleBtn.textContent = "调试模式";
        return;
      }
      const active = state.settings.debugMode === true || state.settings.debugMode === "true";
      el.body.dataset.debug = active ? "on" : "off";
      el.debugPanel.classList.toggle("is-hidden", !active);
      el.debugToggleBtn.textContent = active ? "关闭调试" : "调试模式";
      syncDebugPanelMinimized();
      if (active) updateDebugPanel();
    }

    function setDebugMode(active, options = {}) {
      if (!DEBUG_BUILD_ENABLED) return;
      if (!active && !confirmDiscardDebugEditorChanges("关闭调试模式")) return;
      state.settings.debugMode = Boolean(active);
      if (!state.settings.debugMode) {
        state.debugEditorOpen = false;
        state.debugEditorDirty = false;
      }
      saveSettings();
      applyDebugMode();
      if (!options.silent) {
        showToast(state.settings.debugMode ? "调试模式已开启" : "调试模式已关闭", state.settings.debugMode ? "可查看节点、选项、路由、flag，并可跳转节点。" : "调试面板已隐藏。");
      }
    }

    function toggleDebugMode() {
      if (!DEBUG_BUILD_ENABLED) return;
      setDebugMode(!(state.settings.debugMode === true || state.settings.debugMode === "true"));
    }

    function syncDebugPanelMinimized() {
      if (!el.debugPanel) return;
      el.debugPanel.classList.toggle("is-minimized", state.debugPanelMinimized);
      if (el.debugMinimizeBtn) {
        el.debugMinimizeBtn.textContent = state.debugPanelMinimized ? "展开" : "最小化";
        el.debugMinimizeBtn.setAttribute("aria-pressed", String(state.debugPanelMinimized));
      }
    }

    function setDebugPanelMinimized(minimized) {
      if (!DEBUG_BUILD_ENABLED) return;
      state.debugPanelMinimized = Boolean(minimized);
      syncDebugPanelMinimized();
      updateDebugPanel();
    }

    function getDebugConditionLabel(condition) {
      if (!condition || condition === "default") return "default";
      if (typeof condition === "string") return condition;
      try {
        return JSON.stringify(condition);
      } catch {
        return "[condition]";
      }
    }

    function evaluateConditionForDebug(condition) {
      try {
        return { hit: checkCondition(condition), error: "" };
      } catch (error) {
        return { hit: false, error: error.message || "条件异常" };
      }
    }

    function getDebugNextIds(node) {
      const ids = [];
      if (node?.next) ids.push(node.next);
      (node?.choices || []).forEach(choice => choice.next && ids.push(choice.next));
      (node?.routes || []).forEach(route => route.next && ids.push(route.next));
      return [...new Set(ids)];
    }

    function getDebugParents(nodeId) {
      const indexed = state.story?._devGraph?.nodeIndex?.[nodeId]?.parents;
      if (Array.isArray(indexed)) return normalizeDebugIds(indexed);
      const parents = [];
      Object.entries(state.story?.nodes || {}).forEach(([id, node]) => {
        if (getDebugNextIds(node).includes(nodeId)) parents.push(id);
      });
      return parents;
    }

    function normalizeDebugIds(items) {
      return (items || []).map(item => {
        if (typeof item === "string") return item;
        if (item && typeof item === "object") return item.id || item.nodeId || item.next || item.to || item.from || JSON.stringify(item);
        return String(item);
      }).filter(Boolean);
    }

    function makeDebugPills(items, emptyText = "无") {
      if (!items?.length) return `<span class="debug-empty">${escapeHtml(emptyText)}</span>`;
      return `<div class="debug-pill-list">${items.map(item => `<span class="debug-pill debug-code">${escapeHtml(item)}</span>`).join("")}</div>`;
    }

    function makeDebugSection(title, bodyHtml) {
      return `<section class="debug-section"><h3>${escapeHtml(title)}</h3>${bodyHtml}</section>`;
    }

    function getDebugNodeType(node) {
      if (!node) return "未知";
      if (node.isEnding) return `结局${node.type ? `/${node.type}` : ""}`;
      if (node.routes?.length) return "route";
      if (node.choices?.length) return "选择";
      if (node.next) return "自动";
      return "普通";
    }

    function getDebugNodeCategory(id, node) {
      if (!node) return { label: "未知", flow: true };
      if (node.isEnding || id.startsWith("ending_")) return { label: "结局", flow: false };
      if (/_feedback(?:_|$)/.test(id)) return { label: "分支反馈", flow: false };
      if (/_check(?:_|$)/.test(id)) return { label: "条件检查", flow: true };
      if (/_logic$/.test(id) || node.routes?.length) return { label: "逻辑判断", flow: true };
      if (/_router(?:_|$)/.test(id) || /_route(?:_|$)/.test(id)) return { label: "路由入口", flow: true };
      if (node.choices?.length) return { label: "普通剧情", flow: false };
      if (node.next) return { label: "自动承接", flow: false };
      return { label: "普通剧情", flow: false };
    }

    function getDebugOrderedNodeEntries() {
      if (!state.story?.nodes) return [];
      const nodes = state.story.nodes;
      const seen = new Set();
      const entries = [];
      (state.story._devGraph?.layers || []).forEach(layer => {
        (layer.nodes || []).forEach(id => {
          if (!seen.has(id) && nodes[id]) {
            seen.add(id);
            entries.push([id, nodes[id]]);
          }
        });
      });
      Object.entries(nodes).forEach(([id, node]) => {
        if (!seen.has(id)) entries.push([id, node]);
      });
      return entries;
    }

    function getDebugNodeLabel(order, id, node) {
      const title = node?.title || node?.chapterTitle || "无标题";
      const progress = node?.progress ?? 0;
      const category = getDebugNodeCategory(id, node).label;
      return `${String(order).padStart(3, "0")} · ${id} · ${title} · ${progress}% · ${category}`;
    }

    function refreshDebugNodeList() {
      if (!el.debugNodeList || !state.story?.nodes) return;
      if (el.debugFlowToggle) el.debugFlowToggle.checked = state.debugShowFlowNodes;
      el.debugNodeList.innerHTML = getDebugOrderedNodeEntries()
        .map(([id, node], index) => ({ id, node, index: index + 1, category: getDebugNodeCategory(id, node) }))
        .filter(item => state.debugShowFlowNodes || !item.category.flow)
        .map(item => `<option value="${escapeHtml(item.id)}" label="${escapeHtml(getDebugNodeLabel(item.index, item.id, item.node))}"></option>`)
        .join("");
    }

    function makeDebugEditor(nodeId, node) {
      if (!node) return `<div class="debug-empty">当前没有可编辑节点。</div>`;
      const segments = (node.segments || []).map((segment, index) => {
        const data = typeof segment === "string" ? { speaker: "", text: segment } : segment;
        return `
          <div class="debug-editor-grid" data-edit-segment="${index}">
            <label>段落 ${index + 1} 说话人
              <input data-edit-segment-speaker="${index}" value="${escapeHtml(data.speaker || "")}">
            </label>
            <label>段落 ${index + 1} 文本
              <textarea data-edit-segment-text="${index}">${escapeHtml(data.text || "")}</textarea>
            </label>
          </div>
        `;
      }).join("");
      const choices = (node.choices || []).map((choice, index) => `
        <label>选项 ${index + 1}
          <textarea data-edit-choice-text="${index}">${escapeHtml(choice.text || "")}</textarea>
        </label>
      `).join("");
      const endingFields = node.isEnding ? `
        <label>结局正文
          <textarea data-edit-ending-description>${escapeHtml(node.description || "")}</textarea>
        </label>
        <label>结局收束语
          <textarea data-edit-ending-closing>${escapeHtml(node.closing || "")}</textarea>
        </label>
      ` : "";

      return `
        <div class="debug-editor" data-edit-node-id="${escapeHtml(nodeId)}">
          <div class="debug-empty">编辑只保存到本浏览器测试副本，不会写回源 JSON。结构字段 next / routes / condition / changes 暂不开放编辑。</div>
          <label>标题
            <input data-edit-title value="${escapeHtml(node.title || "")}">
          </label>
          <label>章节标题
            <input data-edit-chapter-title value="${escapeHtml(node.chapterTitle || "")}">
          </label>
          ${segments || `<div class="debug-empty">当前节点没有 segments。</div>`}
          ${choices || `<div class="debug-empty">当前节点没有 choices。</div>`}
          ${endingFields}
          <div class="debug-editor-actions">
            <button class="mini-btn" type="button" data-debug-save-edit>保存到测试副本</button>
            <button class="mini-btn" type="button" data-debug-copy-node-patch>复制当前节点修改</button>
            <button class="mini-btn" type="button" data-debug-close-editor>关闭编辑</button>
          </div>
        </div>
      `;
    }

    function updateDebugPanel() {
      if (!el.debugPanel || el.debugPanel.classList.contains("is-hidden")) return;
      if (!state.story) {
        el.debugContent.innerHTML = makeDebugSection("状态", `<div class="debug-empty">尚未载入剧本。</div>`);
        return;
      }
      refreshDebugNodeList();

      const nodeId = state.currentNodeId || state.story.startNodeId || "";
      if (el.debugNodeInput) {
        el.debugNodeInput.placeholder = nodeId ? `当前：${nodeId}，输入或选择节点 ID 跳转` : "输入或选择节点 ID 跳转";
        if (document.activeElement !== el.debugNodeInput) el.debugNodeInput.value = "";
      }
      if (state.debugPanelMinimized) return;

      const node = state.story.nodes?.[nodeId] || null;
      const nodeCategory = getDebugNodeCategory(nodeId, node);
      const devNode = state.story._devGraph?.nodeIndex?.[nodeId] || {};
      const parents = getDebugParents(nodeId);
      const children = normalizeDebugIds(devNode.children || getDebugNextIds(node));
      const choices = node?.choices || [];
      const routes = node?.routes || [];
      const visibleChoices = choices.map((choice, index) => {
        const result = evaluateConditionForDebug(choice.condition);
        const stateText = result.error ? `异常：${result.error}` : (result.hit ? "可见" : "隐藏");
        return `<span class="debug-pill${result.hit ? " hit" : ""}">${index + 1}. ${escapeHtml(choice.text || "继续")} -> <span class="debug-code">${escapeHtml(choice.next || "空")}</span> / ${escapeHtml(stateText)} / ${escapeHtml(getDebugConditionLabel(choice.condition))}</span>`;
      });
      const routeRows = routes.map((route, index) => {
        const result = evaluateConditionForDebug(route.condition);
        const stateText = result.error ? `异常：${result.error}` : (result.hit ? "命中" : "未命中");
        return `<span class="debug-pill${result.hit ? " hit" : ""}">${index + 1}. ${escapeHtml(getDebugConditionLabel(route.condition))} -> <span class="debug-code">${escapeHtml(route.next || "空")}</span> / ${escapeHtml(stateText)}</span>`;
      });
      const important = (state.keyDecisions || []).map(item => `${item.label || item.id} @ ${item.nodeId || ""}`);
      const varsText = JSON.stringify(state.vars || {}, null, 2);
      const editStatus = DEBUG_EDITOR_ENABLED ? (state.hasDebugEdits ? "当前浏览器有测试副本" : "无") : "编辑模式关闭";

      el.debugContent.innerHTML = [
        makeDebugSection("当前节点", `
          <dl class="debug-kv">
            <dt>ID</dt><dd class="debug-code">${escapeHtml(nodeId || "未开始")}</dd>
            <dt>标题</dt><dd>${escapeHtml(node?.title || node?.chapterTitle || "无标题")}</dd>
            <dt>场景</dt><dd>${escapeHtml(node ? getSceneDisplayLabel(node) : "")}</dd>
            <dt>进度</dt><dd>${escapeHtml(String(node?.progress ?? devNode.progress ?? 0))}</dd>
            <dt>段落</dt><dd>${escapeHtml(`${state.segmentIndex}/${node?.segments?.length || 0}`)}</dd>
            <dt>节点类型</dt><dd>${escapeHtml(`${nodeCategory.label} / ${getDebugNodeType(node)}`)}</dd>
            <dt>测试修改</dt><dd>${escapeHtml(editStatus)}</dd>
          </dl>
        `),
        makeDebugSection("图关系", `
          <div>父节点</div>${makeDebugPills(parents)}
          <div>子节点</div>${makeDebugPills(children)}
        `),
        makeDebugSection("选项", choices.length ? `<div class="debug-pill-list">${visibleChoices.join("")}</div>` : `<div class="debug-empty">当前节点没有 choices。</div>`),
        makeDebugSection("路由", routes.length ? `<div class="debug-pill-list">${routeRows.join("")}</div>` : `<div class="debug-empty">当前节点没有 routes。</div>`),
        makeDebugSection("状态", `
          <dl class="debug-kv">
            <dt>${escapeHtml(state.story.meta.variableName || "状态值")}</dt><dd>${escapeHtml(String(Math.round(state.val || 0)))}</dd>
            <dt>Flags</dt><dd>${escapeHtml(String(state.flags.length))}</dd>
            <dt>关键决定</dt><dd>${escapeHtml(String((state.keyDecisions || []).length))}</dd>
          </dl>
          <div>当前 flags</div>${makeDebugPills(state.flags, "没有 flag")}
          <div>关键决定</div>${makeDebugPills(important, "没有关键决定")}
          <pre class="debug-code">${escapeHtml(varsText)}</pre>
        `),
        state.debugEditorOpen ? makeDebugSection("编辑当前节点", makeDebugEditor(nodeId, node)) : ""
      ].join("");
    }

    function jumpToDebugNode() {
      if (!state.story) return;
      if (!confirmDiscardDebugEditorChanges("跳转节点")) return;
      const nodeId = el.debugNodeInput.value.trim();
      if (!nodeId || !state.story.nodes?.[nodeId]) {
        showToast("节点不存在", nodeId || "请输入节点 ID。");
        return;
      }
      clearReaderSurface();
      el.launcher.classList.add("is-hidden");
      el.body.dataset.mode = "play";
      closeMenu();
      processNode(nodeId, { fromHistory: true, showChapter: true });
      if (el.debugNodeInput) {
        el.debugNodeInput.value = "";
        el.debugNodeInput.blur();
      }
      showToast("已跳转节点", nodeId);
    }

    function setDebugEditorOpen(open) {
      if (!DEBUG_BUILD_ENABLED || !DEBUG_EDITOR_ENABLED) return;
      if (!open && !confirmDiscardDebugEditorChanges("关闭编辑器")) return;
      state.debugEditorOpen = Boolean(open);
      if (!state.debugEditorOpen) state.debugEditorDirty = false;
      updateDebugPanel();
    }

    function saveDebugEditorNode() {
      if (!DEBUG_BUILD_ENABLED || !DEBUG_EDITOR_ENABLED || !state.story) return;
      const editor = el.debugContent.querySelector("[data-edit-node-id]");
      const nodeId = editor?.dataset.editNodeId;
      const node = state.story.nodes?.[nodeId];
      if (!editor || !node) {
        showToast("无法保存", "当前没有可编辑节点。");
        return;
      }

      node.title = editor.querySelector("[data-edit-title]")?.value || "";
      const chapterTitle = editor.querySelector("[data-edit-chapter-title]")?.value || "";
      if (chapterTitle.trim()) node.chapterTitle = chapterTitle;
      else delete node.chapterTitle;

      (node.segments || []).forEach((segment, index) => {
        const speaker = editor.querySelector(`[data-edit-segment-speaker="${index}"]`)?.value || "";
        const text = editor.querySelector(`[data-edit-segment-text="${index}"]`)?.value || "";
        const target = typeof segment === "string" ? { text } : segment;
        target.text = text;
        if (speaker.trim()) target.speaker = speaker;
        else delete target.speaker;
        if (typeof segment === "string") {
          node.segments[index] = target;
        }
      });

      (node.choices || []).forEach((choice, index) => {
        const text = editor.querySelector(`[data-edit-choice-text="${index}"]`)?.value;
        if (text !== undefined) choice.text = text;
      });

      const description = editor.querySelector("[data-edit-ending-description]")?.value;
      const closing = editor.querySelector("[data-edit-ending-closing]")?.value;
      if (description !== undefined) node.description = description;
      if (closing !== undefined) node.closing = closing;

      try {
        assertStory(state.story);
        state.validation = validateStory(state.story);
      } catch (error) {
        showToast("保存失败", error.message);
        return;
      }

      if (saveDebugStoryOverride()) {
        state.debugEditorDirty = false;
        clearReaderSurface();
        state.segmentIndex = 0;
        processNode(nodeId, { fromHistory: true, showChapter: false });
        state.debugEditorOpen = true;
        updateDebugPanel();
        showToast("已保存到测试副本", nodeId);
      }
    }

    async function copyDebugNodePatch() {
      if (!DEBUG_EDITOR_ENABLED || !state.story || !state.baseStory) return;
      const editor = el.debugContent.querySelector("[data-edit-node-id]");
      const nodeId = editor?.dataset.editNodeId || state.currentNodeId;
      const payload = {
        nodeId,
        before: state.baseStory.nodes?.[nodeId] || null,
        after: state.story.nodes?.[nodeId] || null
      };
      try {
        await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
        showToast("当前节点修改已复制", nodeId);
      } catch {
        showToast("复制失败", "浏览器没有开放剪贴板权限。");
      }
    }

    function exportDebugStoryJson() {
      if (!DEBUG_BUILD_ENABLED || !DEBUG_EDITOR_ENABLED || !state.story) return;
      const json = JSON.stringify(state.story, null, 2);
      const blob = new Blob([json], { type: "application/json;charset=utf-8" });
      const link = document.createElement("a");
      const version = state.story.meta?.version || "debug";
      link.href = URL.createObjectURL(blob);
      link.download = `santalucia-sonnyboy-${version}-debug.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      showToast("已导出测试 JSON", link.download);
    }

    async function copyDebugSnapshot() {
      if (!state.story) return;
      const node = state.story.nodes?.[state.currentNodeId] || null;
      const snapshot = {
        story: state.story.meta?.title || "",
        nodeId: state.currentNodeId,
        title: node?.title || node?.chapterTitle || "",
        progress: node?.progress ?? null,
        segmentIndex: state.segmentIndex,
        val: state.val,
        vars: state.vars,
        flags: state.flags,
        keyDecisions: state.keyDecisions,
        choices: (node?.choices || []).map(choice => ({
          text: choice.text || "",
          next: choice.next || "",
          condition: getDebugConditionLabel(choice.condition),
          visible: evaluateConditionForDebug(choice.condition).hit
        })),
        routes: (node?.routes || []).map(route => ({
          next: route.next || "",
          condition: getDebugConditionLabel(route.condition),
          hit: evaluateConditionForDebug(route.condition).hit
        }))
      };
      try {
        await navigator.clipboard.writeText(JSON.stringify(snapshot, null, 2));
        showToast("调试状态已复制", state.currentNodeId || "未开始");
      } catch {
        showToast("复制失败", "浏览器没有开放剪贴板权限。");
      }
    }

    function scheduleAutoplay() {
      clearTimeout(state.autoplayTimer);
      const delay = Number(state.settings.autoplay || 0);
      if (!delay || el.body.dataset.mode !== "play") return;
      state.autoplayTimer = setTimeout(() => {
        if (!el.choices.classList.contains("is-visible")) advance();
      }, delay);
    }

    function readSlot(slot) {
      try {
        const snapshot = JSON.parse(localStorage.getItem(`${state.storageKey}_slot_${slot}`) || "null");
        if (!snapshot) return null;
        if (isValidSnapshot(snapshot)) return snapshot;
        safeLocalRemove(`${state.storageKey}_slot_${slot}`, "手动存档");
        return null;
      } catch {
        return null;
      }
    }

    function writeSlot(slot) {
      if (!state.story || !state.currentNodeId) return;
      safeLocalSet(`${state.storageKey}_slot_${slot}`, JSON.stringify(getSnapshot()), "手动存档");
      showToast("已写入存档槽", `手动存档 ${slot}`);
      renderHomeRecords("saves");
    }

    function loadSlot(slot) {
      const snapshot = slot === "auto" ? getValidAutoSave()?.snapshot : readSlot(slot);
      if (!snapshot) return;
      resetTransientPlayback();
      clearReaderSurface();
      if (!restoreSnapshot(snapshot)) {
        showToast("存档已失效", "当前作品版本已更新，请重新开始。");
        return;
      }
      el.launcher.classList.add("is-hidden");
      el.body.dataset.mode = "play";
      el.recordPanel.classList.remove("is-visible");
      processNode(state.currentNodeId, { fromHistory: true, showChapter: false, keepSegment: true });
    }

    function deleteSlot(slot) {
      safeLocalRemove(`${state.storageKey}_slot_${slot}`, "手动存档");
      renderHomeRecords("saves");
    }

    function getSnapshotDecisionLabels(snapshot, limit = 4) {
      const decisions = Array.isArray(snapshot?.keyDecisions) ? snapshot.keyDecisions : [];
      const labels = [];
      decisions.forEach(item => {
        const label = item?.label || item?.id;
        if (label && !labels.includes(label)) labels.push(label);
      });
      if (!labels.length && snapshot?.flagLabels) {
        (snapshot.flags || []).forEach(flag => {
          const label = snapshot.flagLabels[flag];
          if (label && !labels.includes(label)) labels.push(label);
        });
      }
      return {
        labels: labels.slice(0, limit),
        hiddenCount: Math.max(0, labels.length - limit)
      };
    }

    function appendSnapshotTags(parent, snapshot) {
      if (!snapshot) return;
      const tags = document.createElement("div");
      tags.className = "snapshot-tags";

      const stateTag = document.createElement("span");
      stateTag.className = "snapshot-tag state";
      stateTag.textContent = `缓存状态：${state.story?.meta.variableName || "状态值"} ${Math.round(snapshot.val || 0)}`;
      tags.appendChild(stateTag);

      const { labels, hiddenCount } = getSnapshotDecisionLabels(snapshot);
      labels.forEach(label => {
        const tag = document.createElement("span");
        tag.className = "snapshot-tag";
        tag.textContent = `关键：${label}`;
        tags.appendChild(tag);
      });
      if (hiddenCount) {
        const more = document.createElement("span");
        more.className = "snapshot-tag state";
        more.textContent = `另有 ${hiddenCount} 项`;
        tags.appendChild(more);
      }

      parent.appendChild(tags);
    }

    function describeSnapshot(snapshot) {
      const node = snapshot.currentNodeId || "未知节点";
      const nodeTitle = state.story?.nodes?.[node]?.chapterTitle || state.story?.nodes?.[node]?.title || node;
      const value = Math.round(snapshot.val || 0);
      const { labels, hiddenCount } = getSnapshotDecisionLabels(snapshot, 2);
      const decisions = labels.length
        ? ` · 关键：${labels.join(" / ")}${hiddenCount ? "…" : ""}`
        : "";
      return `${nodeTitle} · ${state.story?.meta.variableName || "状态值"} ${value}${decisions}`;
    }

    function validateStory(story) {
      const issues = [];
      const nodes = story.nodes || {};
      const ids = new Set(Object.keys(nodes));
      const edges = new Map();

      for (const [id, node] of Object.entries(nodes)) {
        const nextIds = [];
        if (node.next) nextIds.push(node.next);
        (node.choices || []).forEach(choice => choice.next && nextIds.push(choice.next));
        (node.routes || []).forEach(route => route.next && nextIds.push(route.next));
        edges.set(id, nextIds);

        nextIds.forEach(next => {
          if (!ids.has(next)) {
            issues.push({ level: "error", title: `断链：${id}`, detail: `指向不存在的节点 ${next}` });
          }
        });

        if (!node.isEnding && !node.next && !node.choices && !node.routes) {
          issues.push({ level: "error", title: `死路：${id}`, detail: "该节点不是结局，也没有后续跳转。" });
        }

        if (node.isEnding && !(node.closing || node.finalText || node.epilogue)) {
          issues.push({ level: "warn", title: `结局缺少收束语：${id}`, detail: "建议给每个结局添加 closing，让结局最后有一段明确的余韵文字。" });
        }

        if (!node.isEnding && (node.segments || node.choices) && !node.scene) {
          issues.push({ level: "warn", title: `缺少场景：${id}`, detail: "建议给有正文或选项的节点添加 scene，方便播放器显示场景名和转场。" });
        }
      }

      const reachable = new Set();
      const stack = [story.startNodeId];
      while (stack.length) {
        const id = stack.pop();
        if (!id || reachable.has(id) || !ids.has(id)) continue;
        reachable.add(id);
        (edges.get(id) || []).forEach(next => stack.push(next));
      }

      ids.forEach(id => {
        if (!reachable.has(id)) {
          issues.push({ level: "warn", title: `不可抵达：${id}`, detail: "从 startNodeId 出发无法到达这个节点。" });
        }
      });

      return issues;
    }

    function showValidationImportResult() {
      if (!state.validation.length) {
        showToast("剧本校验通过", "没有发现断链、死路或不可抵达节点。");
        return;
      }
      const errors = state.validation.filter(item => item.level === "error").length;
      const warnings = state.validation.length - errors;
      showToast("剧本校验提示", `${errors} 个错误，${warnings} 个提醒。详情已写在作品信息行。`);
    }

    function playMediaTransition(type) {
      const className = type === "eject" ? "media-ejecting" : "media-inserting";
      el.body.classList.remove("media-inserting", "media-ejecting", "media-tuning");
      void el.body.offsetWidth;
      el.body.classList.add(className);
      if (type === "insert") {
        setTimeout(() => el.body.classList.add("media-tuning"), 520);
        setTimeout(() => el.body.classList.remove("media-inserting", "media-tuning"), 1500);
      } else {
        setTimeout(() => el.body.classList.remove("media-ejecting"), 900);
      }
    }

    function canUseLocalLibrary() {
      return typeof window.showDirectoryPicker === "function" && "indexedDB" in window;
    }

    function openStoryCacheDb() {
      if (!("indexedDB" in window)) return Promise.resolve(null);
      if (storyCacheDbPromise) return storyCacheDbPromise;
      storyCacheDbPromise = new Promise(resolve => {
        const request = indexedDB.open(STORY_CACHE_DB, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(STORY_CACHE_STORE)) {
            db.createObjectStore(STORY_CACHE_STORE, { keyPath: "title" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => {
          console.error("IndexedDB 打开失败", request.error);
          resolve(null);
        };
      });
      return storyCacheDbPromise;
    }

    async function withStoryCacheStore(mode, action) {
      const db = await openStoryCacheDb();
      if (!db) return null;
      return new Promise(resolve => {
        const transaction = db.transaction(STORY_CACHE_STORE, mode);
        const store = transaction.objectStore(STORY_CACHE_STORE);
        const done = value => resolve(value);
        transaction.onerror = () => {
          console.error("播放带缓存数据库操作失败", transaction.error);
          resolve(null);
        };
        try {
          action(store, done);
        } catch (error) {
          console.error("播放带缓存数据库操作失败", error);
          resolve(null);
        }
      });
    }

    async function migrateLegacyStoryCache() {
      const legacy = localStorage.getItem("branch_story_cache");
      if (!legacy) return;
      try {
        const items = JSON.parse(legacy);
        if (Array.isArray(items) && items.length) {
          await withStoryCacheStore("readwrite", (store, done) => {
            items.forEach(item => item?.story && store.put(item));
            done(true);
          });
        }
        safeLocalRemove("branch_story_cache", "旧播放带缓存");
      } catch (error) {
        console.error("旧播放带缓存迁移失败", error);
        safeLocalRemove("branch_story_cache", "旧播放带缓存");
      }
    }

    async function cacheStory(story) {
      try {
        await migrateLegacyStoryCache();
        const item = {
          title: story.meta.title,
          author: story.meta.author || "佚名",
          version: story.meta.version || "1",
          cachedAt: new Date().toISOString(),
          source: "import",
          story
        };
        const ok = await withStoryCacheStore("readwrite", (store, done) => {
          store.put(item);
          done(true);
        });
        if (!ok) throw new Error("IndexedDB unavailable");
        await trimStoryCache(80);
        renderCachedStories();
      } catch (error) {
        console.error("播放带缓存失败", error);
        showToast("缓存失败", "浏览器没有允许大容量本地数据库，本次仍可游玩但不会加入待选列表。");
      }
    }

    async function readCachedStories() {
      await migrateLegacyStoryCache();
      const items = await withStoryCacheStore("readonly", (store, done) => {
        const request = store.getAll();
        request.onsuccess = () => done(request.result || []);
        request.onerror = () => done([]);
      });
      return (items || []).sort((a, b) => String(b.cachedAt || "").localeCompare(String(a.cachedAt || "")));
    }

    async function trimStoryCache(limit) {
      const items = await readCachedStories();
      const excess = items.slice(limit);
      if (!excess.length) return;
      await withStoryCacheStore("readwrite", (store, done) => {
        excess.forEach(item => store.delete(item.title));
        done(true);
      });
    }

    async function chooseLocalLibrary() {
      if (!canUseLocalLibrary()) {
        showToast("当前浏览器不支持本地资料库", "可以继续使用“插入 JSON”，或用 Edge / Chrome 打开。");
        return;
      }
      try {
        const directory = await window.showDirectoryPicker({ mode: "read" });
        let imported = 0;
        let skipped = 0;
        const libraryItems = [];
        await migrateLegacyStoryCache();
        for await (const entry of directory.values()) {
          if (entry.kind !== "file" || !entry.name.toLowerCase().endsWith(".json")) continue;
          try {
            const file = await entry.getFile();
            const story = JSON.parse(await file.text());
            assertStory(story);
            libraryItems.push({
              title: story.meta.title,
              author: story.meta.author || "佚名",
              version: story.meta.version || "1",
              cachedAt: new Date().toISOString(),
              source: "local",
              fileName: entry.name,
              handle: entry
            });
            imported += 1;
          } catch (error) {
            skipped += 1;
            console.error("本地资料库剧本读取失败", entry.name, error);
          }
        }
        await withStoryCacheStore("readwrite", (store, done) => {
          libraryItems.forEach(item => store.put(item));
          done(true);
        });
        await trimStoryCache(80);
        await renderCachedStories();
        showToast("本地资料库已连接", `已加入 ${imported} 个剧本${skipped ? `，跳过 ${skipped} 个无效文件` : ""}。`);
      } catch (error) {
        if (error?.name !== "AbortError") {
          console.error("本地资料库选择失败", error);
          showToast("本地资料库连接失败", error.message || "浏览器没有授予文件夹读取权限。");
        }
      }
    }

    async function readStoryFromHandle(item) {
      if (!item?.handle) return null;
      const options = { mode: "read" };
      const permission = await item.handle.queryPermission?.(options);
      if (permission !== "granted") {
        const requested = await item.handle.requestPermission?.(options);
        if (requested !== "granted") return null;
      }
      const file = await item.handle.getFile();
      return JSON.parse(await file.text());
    }

    async function renderCachedStories() {
      const items = await readCachedStories();
      el.cacheList.innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "record-item";
        empty.textContent = "还没有缓存的 JSON 剧本。";
        el.cacheList.appendChild(empty);
        return;
      }

      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "cached-tape";
        row.dataset.cacheTitle = item.title;
        const source = item.source === "local" ? "本地资料库" : "备用缓存";
        row.innerHTML = `<button class="mini-btn" type="button" data-cache-open="${escapeHtml(item.title)}"><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.author || "佚名")} · v${escapeHtml(item.version || "1")} · ${source}</span></button><button class="mini-btn" type="button" data-cache-delete="${escapeHtml(item.title)}">丢弃</button>`;
        el.cacheList.appendChild(row);
      });
    }

    async function openCachedStory(title) {
      const items = await readCachedStories();
      const item = items.find(entry => entry.title === title);
      if (!item) return;
      try {
        const story = await readStoryFromHandle(item) || item.story;
        if (!story) {
          showToast("无法读取本地剧本", "请重新选择本地资料库，或重新插入 JSON。");
          return;
        }
        loadStory(story, { animate: true, cache: false });
      } catch (error) {
        console.error("缓存剧本打开失败", item, error);
        showToast("剧本打开失败", error.message || "文件可能已移动、删除或内容损坏。");
      }
    }

    async function deleteCachedStory(title) {
      await withStoryCacheStore("readwrite", (store, done) => {
        store.delete(title);
        done(true);
      });
      await renderCachedStories();
      showToast("已移出目录", title);
    }

    async function clearStoryCache() {
      await withStoryCacheStore("readwrite", (store, done) => {
        store.clear();
        done(true);
      });
      safeLocalRemove("branch_story_cache", "播放带缓存");
      await renderCachedStories();
      showToast("缓存已清空", "已缓存 JSON 剧本列表已清除。");
    }

      clearTimeout(state.autoplayTimer);
      closeReleasePanel();
      if (el.releaseNotice) {
        el.releaseNotice.classList.remove("is-visible");
        el.releaseNotice.hidden = true;
      }
      playMediaTransition("eject");
      setTimeout(() => {
      state.story = null;
        state.currentNodeId = "";
        state.segmentIndex = 0;
        state.val = 0;
        state.vars = {};
        state.flags = [];
        state.flagLabels = {};
        state.keyDecisions = [];
        state.history = [];
        state.choiceHistory = [];
        state.endings = [];
        state.achievements = [];

      el.loadedTitle.textContent = "未载入";

    function showToast(title, body) {
      el.toast.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(body || "")}`;
      el.toast.classList.add("is-visible");
      setTimeout(() => el.toast.classList.remove("is-visible"), 2600);
    }

    function getBuildChannelLabel() {
      if (BUILD_CHANNEL === "public") return "公开版";
      if (BUILD_CHANNEL === "test") return "对外测试版";
      return "本地测试版";
    }

    function getCurrentFeedbackContext() {
      const node = state.story?.nodes?.[state.currentNodeId] || null;
      const context = {
        channel: BUILD_CHANNEL,
        channelLabel: getBuildChannelLabel(),
        url: window.location.href,
        storyTitle: state.story?.meta?.title || "",
        storyVersion: state.story?.meta?.version || "",
        nodeId: state.currentNodeId || "",
        nodeTitle: node?.title || node?.chapterTitle || "",
        progress: node?.progress ?? null,
        segmentIndex: state.segmentIndex ?? 0,
        debugMode: DEBUG_BUILD_ENABLED ? state.settings.debugMode === true || state.settings.debugMode === "true" : false,
        editorMode: DEBUG_EDITOR_ENABLED
      };
      if (DEBUG_BUILD_ENABLED) {
        context.val = Math.round(state.val || 0);
        context.vars = deepClone(state.vars || {});
        context.flags = deepClone(state.flags || []);
        context.visibleChoices = (node?.choices || [])
          .filter(choice => checkCondition(choice.condition))
          .map(choice => ({ text: choice.text || "继续", next: choice.next || "" }));
      }
      return context;
    }

    function buildFeedbackBody(context) {
      const lines = [
        `版本：${context.storyVersion || "未载入"}`,
        `页面：${context.channelLabel}`,
        `作品：${context.storyTitle || "未载入"}`,
        `节点：${context.nodeId || "未开始"}`,
        `标题：${context.nodeTitle || "无"}`,
        `进度：${context.progress ?? "无"}`,
        `段落：${context.segmentIndex}`,
        `页面地址：${context.url}`
      ];

      if (context.channel !== "public") {
        lines.push(
          `调试模式：${context.debugMode ? "开启" : "关闭"}`,
          `编辑模式：${context.editorMode ? "开启" : "关闭"}`,
          `变量值：${context.val ?? "无"}`,
          `Flags：${context.flags?.length ? context.flags.join(", ") : "无"}`,
          `可见选项：${context.visibleChoices?.length ? context.visibleChoices.map(choice => `${choice.text} -> ${choice.next}`).join(" / ") : "无"}`
        );
      }

      if (context.channel === "local") {
        lines.push(
          "",
          "完整调试信息：",
          "```json",
          JSON.stringify(context, null, 2),
          "```"
        );
      }

      return lines.join("\n");
    }

    function setFeedbackContextText(body) {
      if (el.feedbackContextText) {
        el.feedbackContextText.value = body;
      }
    }

    function revealFeedbackContext(body) {
      setFeedbackContextText(body);
      if (!el.feedbackContextText) return;
      el.feedbackContextText.classList.remove("is-hidden");
      if (el.feedbackToggleContextBtn) {
        el.feedbackToggleContextBtn.textContent = "隐藏自动信息";
      }
      el.feedbackContextText.focus();
      el.feedbackContextText.select();
    }

    async function copyFeedbackContext(body, options = {}) {
      setFeedbackContextText(body);
      if (options.reveal) revealFeedbackContext(body);
      try {
        await navigator.clipboard.writeText(body);
        showToast("反馈信息已复制", "请粘贴到问卷的“自动反馈信息”。");
      } catch {
        revealFeedbackContext(body);
        showToast("请手动复制", "浏览器没有开放剪贴板权限，可从弹窗文本框复制。");
      }
    }

    function getFeedbackFormSrc() {
      try {
        const url = new URL(FEEDBACK_FORM_URL, window.location.href);
        url.searchParams.set("_feedback_reload", String(Date.now()));
        return url.toString();
      } catch {
        const separator = FEEDBACK_FORM_URL.includes("?") ? "&" : "?";
        return `${FEEDBACK_FORM_URL}${separator}_feedback_reload=${Date.now()}`;
      }
    }

    function resetFeedbackFrame() {
      if (!el.feedbackFrame) return;
      el.feedbackFrame.src = "about:blank";
    }

    function openFeedback() {
      const context = getCurrentFeedbackContext();
      const body = buildFeedbackBody(context);
      setFeedbackContextText(body);
      el.feedbackContextText?.classList.add("is-hidden");
      if (el.feedbackToggleContextBtn) el.feedbackToggleContextBtn.textContent = "显示自动信息";
      if (el.feedbackFrame) el.feedbackFrame.src = getFeedbackFormSrc();
      if (el.feedbackPanel) {
        el.feedbackPanel.classList.add("is-visible");
        el.feedbackPanel.setAttribute("aria-hidden", "false");
      }
      copyFeedbackContext(body);
    }

    function closeFeedback() {
      el.feedbackPanel?.classList.remove("is-visible");
      el.feedbackPanel?.setAttribute("aria-hidden", "true");
      window.setTimeout(resetFeedbackFrame, 160);
    }

    function copyCurrentFeedbackContext() {
      copyFeedbackContext(buildFeedbackBody(getCurrentFeedbackContext()));
    }

    function toggleFeedbackContext() {
      if (!el.feedbackContextText) return;
      const shouldShow = el.feedbackContextText.classList.contains("is-hidden");
      el.feedbackContextText.classList.toggle("is-hidden", !shouldShow);
      if (el.feedbackToggleContextBtn) {
        el.feedbackToggleContextBtn.textContent = shouldShow ? "隐藏自动信息" : "显示自动信息";
      }
      if (shouldShow) {
        setFeedbackContextText(buildFeedbackBody(getCurrentFeedbackContext()));
        el.feedbackContextText.focus();
        el.feedbackContextText.select();
      }
    }

    function openFeedbackFormWindow() {
      const opened = window.open(getFeedbackFormSrc(), "_blank");
      if (opened) opened.opener = null;
    }

    function showImportantDecision(label = "") {
      clearTimeout(state.decisionTimer);
      el.decisionFloat.textContent = label
        ? `重要决定已记录：${label}`
        : "重要决定已记录";
      el.decisionFloat.classList.remove("is-visible");
      void el.decisionFloat.offsetWidth;
      el.decisionFloat.classList.add("is-visible");
      state.decisionTimer = setTimeout(() => {
        el.decisionFloat.classList.remove("is-visible");
      }, 1800);
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function clearMemory() {
      if (!state.story) return;
      if (el.clearHomeBtn.dataset.confirm !== "true") {
        el.clearHomeBtn.dataset.confirm = "true";
        el.clearHomeBtn.textContent = "确认清除";
        showToast("再次点击确认", "这会清除本作品的自动存档、手动存档、结局、成就和检查点。");
        setTimeout(() => {
          if (el.clearHomeBtn.dataset.confirm === "true") {
            delete el.clearHomeBtn.dataset.confirm;
            el.clearHomeBtn.textContent = "清除记录";
          }
        }, 3600);
        return;
      }
      delete el.clearHomeBtn.dataset.confirm;
      el.clearHomeBtn.textContent = "清除记录";
      safeLocalRemove(`${state.storageKey}_save`, "自动存档");
      safeLocalRemove(`${state.storageKey}_endings`, "结局记录");
      safeLocalRemove(`${state.storageKey}_achievements`, "成就记录");
      safeLocalRemove(`${state.storageKey}_checkpoints`, "检查点");
      for (let i = 1; i <= 3; i += 1) safeLocalRemove(`${state.storageKey}_slot_${i}`, "手动存档");
      state.history = [];
      state.choiceHistory = [];
      state.flagLabels = {};
      state.keyDecisions = [];
      state.endings = [];
      state.achievements = [];
      state.checkpoints = [];
      updateStatus();
      checkContinue();
      renderHomeRecords("none");
    }

    function compactChoiceSnapshot(snapshot) {
      return {
        storyTitle: snapshot.storyTitle || state.story?.meta?.title || "",
        storyVersion: snapshot.storyVersion || state.story?.meta?.version || "",
        currentNodeId: snapshot.currentNodeId,
        segmentIndex: snapshot.segmentIndex || 0,
        val: snapshot.val || 0,
        vars: deepClone(snapshot.vars || {}),
        flags: deepClone(snapshot.flags || []),
        flagLabels: deepClone(snapshot.flagLabels || {}),
        keyDecisions: deepClone(snapshot.keyDecisions || []),
        currentSceneKey: snapshot.currentSceneKey || "",
        choiceLabel: snapshot.choiceLabel || "",
        choiceAt: snapshot.choiceAt || ""
      };
    }

    function compactSnapshot(snapshot) {
      return {
        ...compactChoiceSnapshot(snapshot),
        history: [],
        choiceHistory: (snapshot.choiceHistory || []).map(compactChoiceSnapshot)
      };
    }

    function getSnapshot(options = {}) {
      const includeHistory = options.includeHistory !== false;
      const includeChoiceHistory = options.includeChoiceHistory !== false;
      return {
        storyTitle: state.story?.meta?.title || "",
        storyVersion: state.story?.meta?.version || "",
        currentNodeId: state.currentNodeId,
        segmentIndex: state.segmentIndex,
        val: state.val,
        vars: deepClone(state.vars),
        flags: deepClone(state.flags),
        flagLabels: deepClone(state.flagLabels || {}),
        keyDecisions: deepClone(state.keyDecisions || []),
        currentSceneKey: state.currentSceneKey,
        history: includeHistory ? state.history.map(compactSnapshot) : [],
        choiceHistory: includeChoiceHistory ? state.choiceHistory.map(compactSnapshot) : []
      };
    }

    function getStoryVersion() {
      return state.story?.meta?.version || "";
    }

    function isCurrentStorySnapshot(snapshot) {
      if (!state.story || !snapshot) return false;
      if (snapshot.storyTitle !== state.story.meta.title) return false;
      const version = getStoryVersion();
      return !version || snapshot.storyVersion === version;
    }

    function isValidSnapshot(snapshot, options = {}) {
      if (!isCurrentStorySnapshot(snapshot)) return false;
      if (typeof snapshot.currentNodeId !== "string") return false;
      const node = state.story.nodes?.[snapshot.currentNodeId];
      if (!node) return false;
      return options.allowEnding === true || !node.isEnding;
    }

    function restoreSnapshot(snapshot) {
      if (!isValidSnapshot(snapshot, { allowEnding: true })) return false;
      state.currentNodeId = snapshot.currentNodeId;
      state.segmentIndex = snapshot.segmentIndex || 0;
      state.val = snapshot.val || 0;
      state.vars = deepClone(snapshot.vars || {});
      state.flags = deepClone(snapshot.flags || []);
      state.flagLabels = deepClone(snapshot.flagLabels || {});
      state.keyDecisions = deepClone(snapshot.keyDecisions || []);
      state.history = deepClone(snapshot.history || []);
      state.choiceHistory = deepClone(snapshot.choiceHistory || []);
      state.currentSceneKey = snapshot.currentSceneKey || "";
      updateStatus();
      return true;
    }

    function getNode(id) {
      const node = state.story?.nodes?.[id];
      if (!node) throw new Error(`节点不存在：${id}`);
      return node;
    }

    function normalizeSegment(segment) {
      if (typeof segment === "string") return { speaker: "", text: segment, effects: [] };
      return {
        speaker: segment.speaker || "",
        text: segment.text || "",
        effects: mergeEffects(segment.effect, segment.effects)
      };
    }

    function mergeEffects(...values) {
      return values.flatMap(value => {
        if (!value) return [];
        return Array.isArray(value) ? value : [value];
      }).filter(Boolean);
    }

    function parseLiteral(raw) {
      const text = raw.trim();
      if (/^['"].*['"]$/.test(text)) return text.slice(1, -1);
      if (text === "true") return true;
      if (text === "false") return false;
      if (!Number.isNaN(Number(text))) return Number(text);
      return text;
    }

    function isSystemSpeaker(speaker) {
      return ["系统", "System", "旁白", "Narrator"].includes(speaker);
    }

    function clampNumber(value, min, max) {
      return Math.min(max, Math.max(min, Number(value) || 0));
    }

    function deepClone(value) {
      if (typeof structuredClone === "function") return structuredClone(value);
      return JSON.parse(JSON.stringify(value));
    }

    function slug(text) {
      return String(text || "story").replace(/[^\p{L}\p{N}]+/gu, "_").slice(0, 48);
    }

    function isEditableElement(target) {
      return Boolean(target?.closest?.("input, textarea, select, [contenteditable='true']"));
    }

    function isDebugEditorActive() {
      return DEBUG_BUILD_ENABLED
        && DEBUG_EDITOR_ENABLED
        && state.debugEditorOpen
        && !el.debugPanel?.classList.contains("is-hidden");
    }

    function isDebugEditorNavigationLocked(action = "切换剧情") {
      if (!isDebugEditorActive()) return false;
      showToast("编辑模式已锁定当前节点", `${action}已暂时禁用。请先保存到测试副本，或关闭编辑器。`);
      return true;
    }

    function confirmDiscardDebugEditorChanges(action = "继续") {
      if (!state.debugEditorDirty) return true;
      const confirmed = window.confirm(`当前节点编辑尚未保存。要${action}并放弃这些未保存修改吗？`);
      if (confirmed) state.debugEditorDirty = false;
      return confirmed;
    }

    function advance() {
      if (!el.sceneCard.classList.contains("is-hidden")) return;
      if (state.isInputLocked && el.overlayScreen.classList.contains("is-hidden")) {
        state.isInputLocked = false;
      }
      if (isDebugEditorNavigationLocked("继续正文")) return;
      if (state.isInputLocked || !state.story || el.choices.classList.contains("is-visible")) return;
      const node = getNode(state.currentNodeId);
      if (node.isEnding) return;
      const segments = node.segments || [];
      if (state.segmentIndex < segments.length) {
        state.segmentIndex += 1;
        saveGame();
        renderSegment();
      }
    }

    function handlePageClick(event) {
      if (event.defaultPrevented) return;
      if (!el.sceneCard.classList.contains("is-hidden")) return;
      if (event.target.closest("button, input, textarea, select, .launcher, .menu-panel, .debug-panel")) return;
      if (el.body.dataset.mode !== "play") return;
      if (isDebugEditorActive()) return;
      advance();
    }

    el.importBtn.addEventListener("click", () => el.fileInput.click());
    document.addEventListener("click", event => {
      const clickable = event.target.closest("button");
      if (!clickable) return;
      clickable.classList.remove("clicked");
      void clickable.offsetWidth;
      clickable.classList.add("clicked");
      setTimeout(() => clickable.classList.remove("clicked"), 280);
    }, true);
    el.fileInput.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          loadStory(JSON.parse(reader.result), { animate: true, cache: true });
        } catch (error) {
          alert(`剧本导入失败：${error.message}`);
        }
      };
      reader.readAsText(file, "utf-8");
      event.target.value = "";
    });

    el.sampleBtn.addEventListener("click", () => {
      loadStory(deepClone(SAMPLE_STORY), { animate: true, cache: true });
    });
    if (!canUseLocalLibrary()) {
      el.libraryBtn.disabled = true;
      el.libraryBtn.title = "当前浏览器不支持本地资料库，请使用 Edge 或 Chrome。";
    }
    el.libraryBtn.addEventListener("click", chooseLocalLibrary);
    el.clearCacheBtn.addEventListener("click", clearStoryCache);
    el.cacheList.addEventListener("click", event => {
      const openButton = event.target.closest("[data-cache-open]");
      if (openButton) {
        openCachedStory(openButton.dataset.cacheOpen);
        return;
      }
      const deleteButton = event.target.closest("[data-cache-delete]");
      if (deleteButton) {
        deleteCachedStory(deleteButton.dataset.cacheDelete);
      }
    });
    el.startBtn.addEventListener("click", () => startGame(false));
    el.continueBtn.addEventListener("click", () => startGame(true));
    el.restartHomeBtn.addEventListener("click", () => startGame(false));
    el.homeEndingsBtn.addEventListener("click", () => renderHomeRecords("endings"));
    el.homeAchievementsBtn.addEventListener("click", () => renderHomeRecords("achievements"));
    el.homeChaptersBtn.addEventListener("click", () => renderHomeRecords("chapters"));
    el.homeSavesBtn.addEventListener("click", () => renderHomeRecords("saves"));
    el.homeSettingsBtn.addEventListener("click", () => renderHomeRecords("settings"));
    el.releaseNoticeOpenBtn?.addEventListener("click", () => openReleasePanel({ dismissNotice: true }));
    el.releaseNoticeCloseBtn?.addEventListener("click", dismissReleaseNotice);
    el.releasePanelCloseBtn?.addEventListener("click", closeReleasePanel);
    el.ejectBtn.addEventListener("click", ejectStory);
    el.clearHomeBtn.addEventListener("click", clearMemory);
    document.addEventListener("click", event => {
      if (event.target.closest("[data-release-open]")) {
        event.preventDefault();
        openReleasePanel({ dismissNotice: true });
        return;
      }
      if (!el.releasePanel?.classList.contains("is-visible")) return;
      if (event.target.closest(".release-panel, .release-notice")) return;
      closeReleasePanel();
    });
    el.recordList.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const slot = button.dataset.value;
      if (button.dataset.action === "load-slot") loadSlot(slot);
      if (button.dataset.action === "delete-slot") deleteSlot(slot);
      if (button.dataset.action === "load-checkpoint") loadCheckpointById(slot);
    });
    el.recordList.addEventListener("change", event => {
      const input = event.target.closest("[data-setting]");
      if (!input) return;
      const key = input.dataset.setting;
      state.settings[key] = key === "fontScale" || key === "autoplay" ? Number(input.value) : input.value;
      saveSettings();
      applySettings();
      showToast("设置已更新", "新的阅读设置已经保存。");
    });
    document.addEventListener("click", event => {
      const button = event.target.closest("[data-color-mode-choice]");
      if (!button) return;
      event.stopPropagation();
      setColorMode(button.dataset.colorModeChoice);
      showToast("明暗模式已更新", button.textContent.trim());
    });
    document.addEventListener("click", handlePageClick);
    el.feedbackBtn?.addEventListener("click", openFeedback);
    el.feedbackCloseBtn?.addEventListener("click", closeFeedback);
    el.feedbackCopyBtn?.addEventListener("click", copyCurrentFeedbackContext);
    el.feedbackToggleContextBtn?.addEventListener("click", toggleFeedbackContext);
    el.feedbackOpenBtn?.addEventListener("click", openFeedbackFormWindow);
    el.feedbackPanel?.addEventListener("click", event => {
      if (event.target === el.feedbackPanel) closeFeedback();
    });
    el.backBtn.addEventListener("click", goBack);
    el.menuBtn.addEventListener("click", openMenu);
    el.menuPanel.addEventListener("click", event => {
      if (event.target === el.menuPanel) closeMenu();
    });
    el.resumeBtn.addEventListener("click", closeMenu);
    el.homeBtn.addEventListener("click", returnToHome);
    el.skipBtn.addEventListener("click", () => {
      closeMenu();
      skipToChoice();
    });
    el.checkpointBtn.addEventListener("click", () => {
      closeMenu();
      goBack();
    });
    el.debugToggleBtn?.addEventListener("click", () => {
      closeMenu();
      toggleDebugMode();
    });
    el.debugCloseBtn?.addEventListener("click", () => setDebugMode(false));
    el.debugMinimizeBtn?.addEventListener("click", () => setDebugPanelMinimized(!state.debugPanelMinimized));
    el.debugRefreshBtn?.addEventListener("click", () => {
      if (!confirmDiscardDebugEditorChanges("刷新调试面板")) return;
      updateDebugPanel();
    });
    el.debugJumpBtn?.addEventListener("click", jumpToDebugNode);
    el.debugNodeInput?.addEventListener("focus", () => {
      el.debugNodeInput.value = "";
      refreshDebugNodeList();
    });
    el.debugFlowToggle?.addEventListener("change", () => {
      state.debugShowFlowNodes = el.debugFlowToggle.checked;
      refreshDebugNodeList();
      showToast(state.debugShowFlowNodes ? "已显示流程节点" : "已隐藏流程节点", "下拉列表已更新。");
    });
    el.debugNodeInput?.addEventListener("change", () => {
      if (state.story?.nodes?.[el.debugNodeInput.value.trim()]) jumpToDebugNode();
    });
    el.debugNodeInput?.addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      jumpToDebugNode();
    });
    el.debugCopyBtn?.addEventListener("click", copyDebugSnapshot);
    el.debugEditBtn?.addEventListener("click", () => setDebugEditorOpen(!state.debugEditorOpen));
    el.debugExportBtn?.addEventListener("click", exportDebugStoryJson);
    el.debugClearEditsBtn?.addEventListener("click", clearDebugStoryOverride);
    el.debugContent?.addEventListener("click", event => {
      if (event.target.closest("[data-debug-save-edit]")) {
        event.preventDefault();
        saveDebugEditorNode();
      } else if (event.target.closest("[data-debug-copy-node-patch]")) {
        event.preventDefault();
        copyDebugNodePatch();
      } else if (event.target.closest("[data-debug-close-editor]")) {
        event.preventDefault();
        setDebugEditorOpen(false);
      }
    });
    el.debugContent?.addEventListener("input", event => {
      if (!event.target.closest(".debug-editor")) return;
      state.debugEditorDirty = true;
    });
    el.debugContent?.addEventListener("keydown", event => {
      if (!event.target.closest(".debug-editor")) return;
      if (!isEditableElement(event.target)) return;
      event.stopPropagation();
    });
    el.menuChaptersBtn.addEventListener("click", renderMenuChapterSelect);
    el.menuChapterList.addEventListener("click", event => {
      const button = event.target.closest("button[data-action='load-checkpoint']");
      if (!button) return;
      closeMenu();
      loadCheckpointById(button.dataset.value);
    });
    el.quickSaveBtn.addEventListener("click", () => {
      writeSlot(1);
      closeMenu();
    });

    document.addEventListener("keydown", event => {
      if (event.defaultPrevented) return;
      if (isEditableElement(event.target)) return;
      if (event.key === "Escape") {
        if (el.feedbackPanel?.classList.contains("is-visible")) closeFeedback();
        else if (el.releasePanel?.classList.contains("is-visible")) closeReleasePanel();
        else if (!el.menuPanel.classList.contains("is-hidden")) closeMenu();
        else if (state.story && el.body.dataset.mode === "play") openMenu();
      }
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        advance();
      }
      if (event.key === "ArrowLeft") goBack();
      if (event.key === "ArrowRight") skipToChoice();
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "d") {
        event.preventDefault();
        toggleDebugMode();
      }
    });
    applySettings();
    renderCachedStories();
    if (SAMPLE_STORY?.nodes && Object.keys(SAMPLE_STORY.nodes).length) {
      loadStory(deepClone(SAMPLE_STORY), { animate: false, cache: false });
    }
  </script>
</body>
</html>
